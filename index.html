<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Login — Demo</title>
	<link rel="stylesheet" href="index.css">
</head>
<body>
	<div class="bg" aria-hidden="true"></div>
	<main class="container">
		<section class="card login-card" aria-labelledby="loginTitle">
			<div class="brand">
				<h1 id="loginTitle">MyApp</h1>
				<p class="subtitle">Welcome back — please sign in to your account</p>
			</div>

			<form id="loginForm" class="form" novalidate>
				<div class="input-group">
					<label for="email">Email</label>
					<input id="email" name="email" type="email" placeholder="you@example.com" required />
					<small class="error" id="emailError" aria-live="polite"></small>
				</div>

				<div class="input-group">
					<label for="password">Password</label>
					<div class="password-wrap">
						<input id="password" name="password" type="password" minlength="6" placeholder="Enter your password" required />
						<button type="button" class="toggle" id="togglePassword" aria-label="Show password">Show</button>
					</div>
					<small class="error" id="passwordError" aria-live="polite"></small>
				</div>

				<div class="row between small">
					<label class="remember"><input type="checkbox" id="remember"> Remember me</label>
					<a class="forgot" href="#">Forgot?</a>
				</div>

				<button class="btn primary" type="submit">Sign in</button>

				<div class="divider"><span>or</span></div>

				<div class="socials">
					<button type="button" class="btn social google">Sign in with Google</button>
					<button type="button" class="btn social">Sign in with GitHub</button>
				</div>
			</form>

			<p class="signup">Don't have an account? <a href="#">Sign up</a></p>

			<div id="toast" role="status" aria-live="polite" class="toast" hidden></div>
		</section>
	</main>

	<script src="script.js" defer></script>
</body>
</html>
